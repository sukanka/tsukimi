name: Artifacts

on:
  workflow_call:

permissions:
  contents: write

jobs:
    telegram:
      name: Upload
      runs-on: ubuntu-latest
      services:
        docker:
          image: aiogram/telegram-bot-api:latest
          env:
            TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
            TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          ports:
            - 8081:8081
          
      steps:
        - name: Download artifact
          uses: actions/download-artifact@v8
          with:
            skip-decompress: true
            path: artifacts
            merge-multiple: true

        - name: Upload to Telegram
          uses: MutsukiC/telegram-files@v1
          with:
            api-url: "http://localhost:8081"
            token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
            chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
            files: artifacts/*
            body: |
              Tsukimi CI
              Commit Message: ${{ github.event.head_commit.message}}
              Commit URL: ${{ github.event.head_commit.url }}
              Branch: ${{ github.ref }}
          continue-on-error: true

    release:
      name: Release
      runs-on: ubuntu-latest
      if: ${{ github.ref_type == 'tag' }}
      steps:
        - name: Download artifact
          uses: actions/download-artifact@v8
          with:
            path: artifacts
            skip-decompress: true
            merge-multiple: true
        
        - name: Create release
          uses: softprops/action-gh-release@v3
          with:
            files: artifacts/*
            prerelease: ${{ contains(github.ref_name, 'rc') }}

    nightly:
      name: Nightly Release
      runs-on: ubuntu-latest
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      steps:
        - name: Download artifacts
          uses: actions/download-artifact@v8
          with:
            skip-decompress: true
            path: nightly-artifacts
            merge-multiple: true

        - name: Create nightly metadata
          run: |
            echo "NIGHTLY_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"
            echo "NIGHTLY_TAG=nightly-$(date -u +%Y-%m-%d)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
            echo "NIGHTLY_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

        - name: Publish nightly release
          uses: softprops/action-gh-release@v3
          with:
            tag_name: ${{ env.NIGHTLY_TAG }}
            name: Nightly ${{ env.NIGHTLY_DATE }}
            prerelease: true
            make_latest: false
            target_commitish: ${{ github.sha }}
            files: nightly-artifacts/*
            body: |
              Automated nightly build
              Branch: ${{ github.ref_name }}
              Commit: ${{ env.NIGHTLY_SHA }}
