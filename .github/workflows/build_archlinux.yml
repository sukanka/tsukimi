name: Arch Linux
on:
  workflow_call:

jobs:
  build:
    name: Build (${{ matrix.platform }})

    strategy:
      matrix:
        include:
          - platform: amd64
            os: ubuntu-latest

    container:
      image: archlinux:latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Install dependencies
        run: |
          pacman-key --init
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel \
            blueprint-compiler \
            git \
            sudo

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0
          fetch-tags: true

      - name: Set pkgver for CI
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE_VERSION="$(grep '^version =' Cargo.toml | head -n1 | cut -d\" -f2)"
          REV_COUNT="$(git rev-list --count HEAD)"
          GIT_HASH="$(git rev-parse --short=7 HEAD)"
          CI_PKGVER="${BASE_VERSION}.r${REV_COUNT}.g${GIT_HASH}"
          sed -i "s/^pkgver=.*/pkgver=${CI_PKGVER}/" PKGBUILD
          grep '^pkgver=' PKGBUILD

      - name: Write DANDANAPI secret key
        env:
          DANDANAPI_SECRET_KEY: ${{ secrets.DANDANAPI_SECRET_KEY }}
        run: |
          echo $DANDANAPI_SECRET_KEY > secret/key

      - name: Prepare source tarball
        run: |
          rm -f /tmp/tsukimi-src.tar.gz tsukimi-src.tar.gz
          tar --exclude=./target --exclude=./.git -czf /tmp/tsukimi-src.tar.gz --transform 's,^\.,tsukimi,' .
          mv /tmp/tsukimi-src.tar.gz ./tsukimi-src.tar.gz

      - name: Build tsukimi package for ${{ matrix.platform }}
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder
          rm -rf /tmp/pkgbuild
          mkdir -p /tmp/pkgbuild
          cp PKGBUILD tsukimi-src.tar.gz /tmp/pkgbuild/
          chown -R builder:builder /tmp/pkgbuild
          su -m builder -c "cd /tmp/pkgbuild && makepkg --noconfirm --syncdeps --cleanbuild --clean --holdver"
          cp /tmp/pkgbuild/tsukimi-git-*.pkg.tar.zst "$GITHUB_WORKSPACE"/
          for f in "$GITHUB_WORKSPACE"/*.pkg.tar.zst; do
            mv "$f" "$(echo "$f" | sed 's/:/_/g')"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: tsukimi-${{ matrix.platform }}-archlinux-linux
          path: "tsukimi-git-[0-9]*.pkg.tar.zst"
          archive: false

      - name: Upload debug artifact
        uses: actions/upload-artifact@v7
        with:
          name: tsukimi-${{ matrix.platform }}-archlinux-debug-linux
          path: "tsukimi-git-debug-*.pkg.tar.zst"
          archive: false
